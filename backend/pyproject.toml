[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for CRM_Template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
    "pwdlib[argon2]>=0.3.0",
    "alembic>=1.18.5",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
