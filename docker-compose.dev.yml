name: crm-base-dev

services:
  db:
    env_file:
      - ./env/dev/.env.db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./env/dev/.env.backend
    ports:
      - "8000:8000"
    command: uv run uvicorn app.mail:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    env_file:
      - ./env/dev/.env.frontend
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_pnpm_store:
