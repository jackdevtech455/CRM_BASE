services:
  db:
    env_file:
      - .env.dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/pnpm/store
    env_file:
      - .env.dev
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_pnpm_store:
