name: crm-base-prod

services:
  db:
    env_file:
      - ./env/prod/.env.db

  backend:
    image: ghcr.io/jackdevtech455/crm_base-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    env_file:
      - ./env/prod/.env.backend
    expose:
      - "8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: ghcr.io/jackdevtech455/crm_base-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    env_file:
      - ./env/prod/.env.frontend
    expose:
      - "5173"
    networks:
      proxy:
        aliases:
          - crm-base-prod-frontend
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:

networks:
  proxy:
    external: true
