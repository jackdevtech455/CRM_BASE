services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    restart: unless-stopped
    networks:
      - app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  frontend:
    restart: unless-stopped
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy

networks:
  app:
