name: Build and deploy staging

run-name: Deploy sha-${{ github.sha }} to staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/jackdevtech455/crm_base-backend
  FRONTEND_IMAGE: ghcr.io/jackdevtech455/crm_base-frontend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.crm-base.farrow-seven.network

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy staging Compose files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          source: "docker-compose.base.yml,docker-compose.staging.yml"
          target: "/opt/crm-base/staging"

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e

            export IMAGE_TAG
            cd /opt/crm-base/staging

            docker compose \
              -f docker-compose.base.yml \
              -f docker-compose.staging.yml \
              pull

            docker compose \
              -f docker-compose.base.yml \
              -f docker-compose.staging.yml \
              run --rm backend uv run alembic upgrade head

            docker compose \
              -f docker-compose.base.yml \
              -f docker-compose.staging.yml \
              up -d --remove-orphans

      - name: Write deployment summary
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          {
            echo "## Staging deployment complete"
            echo
            echo "**Image tag:** \`$IMAGE_TAG\`"
            echo
            echo "**Commit:** \`${{ github.sha }}\`"
            echo
            echo "[Open staging](https://staging.crm-base.farrow-seven.network)"
          } >> "$GITHUB_STEP_SUMMARY"
