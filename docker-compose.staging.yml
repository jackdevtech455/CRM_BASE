services:
  db:
    env_file:
      - .env.staging  # TODO make crash if not found
    networks:
      - internal

  backend:
    image: ghcr.io/jackdevtech455/crm_base-backend:latest
    env_file:
      - .env.staging
    expose:
      - "8000"
    networks:
      - internal
      - proxy

  frontend:
    image: ghcr.io/jackdevtech455/crm_base-frontend:latest
    expose:
      - "5173"
    env_file:
      - .env.staging
    networks:
      - proxy
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  proxy:
    external: true
